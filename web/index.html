<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi layanan mandiri karyawan Absensas: absensi dan pengajuan izin.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Absensas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Absensas – Self Service Karyawan" />
  <meta property="og:description" content="Aplikasi layanan mandiri karyawan Absensas: absensi dan pengajuan izin." />
  <meta property="og:image" content="icons/Icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Absensas – Self Service Karyawan" />
  <meta name="twitter:description" content="Aplikasi layanan mandiri karyawan Absensas: absensi dan pengajuan izin." />
  <meta name="twitter:image" content="icons/Icon-512.png" />

  <title>Absensas</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" style="
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  ">
    <img src="icons/Icon-192.png" width="80" height="80" alt="" style="border-radius: 20px; margin-bottom: 24px;" />
    <div style="
      width: 160px; height: 3px;
      background: #e5e7eb;
      border-radius: 2px;
      overflow: hidden;
    ">
      <div id="loading-bar" style="
        height: 100%; width: 0;
        background: #22c55e;
        border-radius: 2px;
        transition: width 0.3s ease;
      "></div>
    </div>
  </div>
  <script>
    var bar = document.getElementById('loading-bar');
    var pct = 0;
    var interval = setInterval(function() {
      pct = Math.min(pct + Math.random() * 15, 90);
      bar.style.width = pct + '%';
    }, 400);
    window.addEventListener('flutter-first-frame', function() {
      clearInterval(interval);
      bar.style.width = '100%';
      setTimeout(function() {
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
